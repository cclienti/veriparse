# conda-build defaults osx-64 to macOS 10.9, below the macOS 11.0 floor of
# the libc++ the toolchain ships; its "platform no longer supported" warning
# is fatal under -Werror. Align osx-64 with the osx-arm64 default.
MACOSX_DEPLOYMENT_TARGET:  # [osx and x86_64]
  - "11.0"                 # [osx and x86_64]
